name: Frontend

on:
  push:
    paths-ignore:
      - "backend/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "backend/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Syntaxe des fichiers de déploiement (js-yaml : dépendance transitive d'ESLint).
      - name: Valider vercel.json et render.yaml
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("vercel.json", "utf8"))'
          node -e 'require("js-yaml").load(require("fs").readFileSync("render.yaml", "utf8"))'
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
