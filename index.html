<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b5d46" />
    <meta
      name="description"
      content="AfrikaBnB — marketplace de démonstration pour découvrir des séjours en Afrique. Projet démo, sans réservation payante."
    />
    <meta name="robots" content="index, follow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Thème clair/sombre choisi par l'utilisateur, posé avant le rendu (pas de flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("afrikabnb_theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-lome-1600.webp"
      imagesrcset="/images/hero-lome-800.webp 800w, /images/hero-lome-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <!-- Google Fonts chargées uniquement après consentement cookies (ConsentContext) -->
    <title>AfrikaBnB — Séjours en Afrique (démo)</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "AfrikaBnB",
        "description": "Marketplace de location courte durée en démonstration (auto-entrepreneur).",
        "url": "/",
        "email": "[À COMPLÉTER]"
      }
    </script>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser AfrikaBnB.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
